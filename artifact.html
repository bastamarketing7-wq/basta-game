<style>
/* ============================================================
   BASTA PLAY · main.css
   Design tokens, reset, layout, glassmorphism, theming
   Brand: Blue #1E5BD6 · White · Orange #F97316
   ============================================================ */

/* ---------- Design Tokens ---------- */
:root {
  --blue: #1E5BD6;
  --blue-600: #1a4fbd;
  --blue-400: #4d82e6;
  --blue-300: #7aa3ee;
  --orange: #F97316;
  --orange-400: #fb8f42;
  --white: #ffffff;

  --font: "SF Arabic", "Geeza Pro", "Segoe UI", "Tahoma", "Noto Kufi Arabic", "Noto Sans Arabic", "Helvetica Neue", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --arabic: "SF Arabic", "Geeza Pro", "Tahoma", "Noto Naskh Arabic", "Segoe UI", sans-serif;

  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-xl: 34px;

  --pad: clamp(16px, 3.5vw, 34px);
  --maxw: 1180px;

  --t-fast: 0.16s;
  --t-med: 0.32s;
  --t-slow: 0.6s;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);

  --shadow-1: 0 6px 20px rgba(9, 20, 44, 0.18);
  --shadow-2: 0 18px 50px rgba(9, 20, 44, 0.32);
  --glow-blue: 0 0 40px rgba(30, 91, 214, 0.45);
  --glow-orange: 0 0 40px rgba(249, 115, 22, 0.45);
}

/* Dark theme (default) */
[data-theme="dark"] {
  --bg: #070b18;
  --bg-2: #0c1428;
  --ink: #eef3ff;
  --ink-soft: #a9b7d6;
  --ink-mute: #6d7b9a;
  --line: rgba(255, 255, 255, 0.10);
  --glass: rgba(20, 32, 62, 0.55);
  --glass-2: rgba(30, 46, 86, 0.42);
  --glass-brd: rgba(255, 255, 255, 0.14);
  --card: rgba(18, 28, 55, 0.6);
  --shade: rgba(0, 0, 0, 0.55);
}

/* Light theme */
[data-theme="light"] {
  --bg: #eef2fb;
  --bg-2: #dde6f8;
  --ink: #0c1730;
  --ink-soft: #3b496b;
  --ink-mute: #6b789a;
  --line: rgba(12, 23, 48, 0.10);
  --glass: rgba(255, 255, 255, 0.62);
  --glass-2: rgba(255, 255, 255, 0.42);
  --glass-brd: rgba(255, 255, 255, 0.75);
  --card: rgba(255, 255, 255, 0.7);
  --shade: rgba(20, 30, 60, 0.35);
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  line-height: 1.5;
  transition: background var(--t-med) var(--ease), color var(--t-med) var(--ease);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul { list-style: none; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--orange); color: #fff; }

/* Accessibility: reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

/* ---------- Background FX ---------- */
.bg-fx { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
.bg-fx .orb {
  position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5;
  will-change: transform;
}
.orb--blue { width: 46vw; height: 46vw; background: var(--blue); top: -12vw; left: -10vw; animation: float1 22s var(--ease) infinite alternate; }
.orb--orange { width: 34vw; height: 34vw; background: var(--orange); bottom: -10vw; right: -8vw; animation: float2 26s var(--ease) infinite alternate; opacity: 0.42; }
.orb--blue2 { width: 30vw; height: 30vw; background: var(--blue-400); top: 40%; right: 20%; animation: float3 30s var(--ease) infinite alternate; opacity: 0.3; }
.grid-glow {
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 54px 54px;
  mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 72%);
  -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 72%);
  opacity: 0.5;
}
[data-theme="light"] .bg-fx .orb { opacity: 0.32; }

.confetti-canvas { position: fixed; inset: 0; z-index: 60; pointer-events: none; }

/* ---------- App Shell ---------- */
.app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.glass {
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--glass-brd);
}

/* Topbar */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 10px clamp(12px, 3vw, 26px);
  padding-top: max(10px, env(safe-area-inset-top));
  border-left: none; border-right: none; border-top: none;
  border-radius: 0 0 var(--r-md) var(--r-md);
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand__logo { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(30,91,214,.4)); transition: transform var(--t-med) var(--ease-back); }
.brand:hover .brand__logo, .brand:active .brand__logo { transform: rotate(-8deg) scale(1.06); }
.brand__text { font-weight: 800; letter-spacing: 0.5px; font-size: clamp(15px, 2.4vw, 20px); }
.brand__text .accent, .accent { color: var(--orange); }

.hud { display: flex; align-items: center; gap: 8px; margin: 0 auto; }
.hud__item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px;
  background: var(--glass-2); border: 1px solid var(--glass-brd);
  font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
}
.hud__ico { color: var(--blue-300); font-size: 12px; }
.coin-ico { color: var(--orange); }
.hud__xp { padding-left: 8px; }
.hud__xpbar { width: clamp(40px, 12vw, 96px); height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
.hud__xpfill { display: block; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--blue-300)); transition: width var(--t-slow) var(--ease); }

.topbar__actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; font-size: 17px;
  background: var(--glass-2); border: 1px solid transparent;
  transition: transform var(--t-fast) var(--ease), background var(--t-fast), border-color var(--t-fast);
}
.icon-btn:hover { background: var(--glass); border-color: var(--glass-brd); transform: translateY(-2px); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn .icon-btn__off, .icon-btn[aria-pressed="false"] .icon-btn__on { display: none; }
.icon-btn[aria-pressed="false"] .icon-btn__off { display: inline; }
.theme-light { display: none; }
[data-theme="light"] .theme-dark { display: none; }
[data-theme="light"] .theme-light { display: inline; }

/* Drawer */
.drawer {
  position: fixed; top: 0; right: 0; z-index: 55; height: 100%;
  width: min(320px, 86vw);
  padding: 22px 20px; padding-top: max(22px, env(safe-area-inset-top));
  display: flex; flex-direction: column; gap: 18px;
  transform: translateX(105%); transition: transform var(--t-med) var(--ease);
  border-radius: var(--r-lg) 0 0 var(--r-lg);
}
.drawer.open { transform: translateX(0); }
.drawer__close { position: absolute; top: 14px; left: 14px; }
.drawer__profile { display: flex; align-items: center; gap: 12px; margin-top: 30px; }
.drawer__ava { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff; background: linear-gradient(135deg, var(--blue), var(--orange)); box-shadow: var(--shadow-1); }
.drawer__name { font-weight: 800; font-size: 17px; }
.drawer__rank { font-size: 12px; color: var(--orange); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
.drawer__list { display: flex; flex-direction: column; gap: 4px; }
.drawer__link { width: 100%; text-align: start; padding: 13px 14px; border-radius: 14px; font-weight: 600; font-size: 15px; transition: background var(--t-fast), transform var(--t-fast); }
.drawer__link:hover { background: var(--glass-2); transform: translateX(-4px); }
.drawer__reset { margin-top: auto; padding: 11px; border-radius: 12px; font-weight: 700; color: var(--orange); border: 1px solid var(--orange); background: transparent; transition: background var(--t-fast), color var(--t-fast); }
.drawer__reset:hover { background: var(--orange); color: #fff; }
.drawer__foot { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); text-align: center; }
.drawer__brandimg { width: 130px; opacity: 0.9; border-radius: 8px; background: #fff; padding: 6px; }

.scrim { position: fixed; inset: 0; z-index: 50; background: var(--shade); backdrop-filter: blur(2px); animation: fadeIn var(--t-med) var(--ease); }

/* View / Router */
.view {
  flex: 1; width: 100%; max-width: var(--maxw); margin: 0 auto;
  padding: var(--pad); padding-bottom: 40px;
}
.appfoot { text-align: center; padding: 18px; font-size: 12px; color: var(--ink-mute); border-top: 1px solid var(--line); }

/* Utility */
.center-col { display: flex; flex-direction: column; align-items: center; }
.hidden { display: none !important; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* RTL support for Arabic content blocks */
[dir="rtl"] { font-family: var(--arabic); }

/* ============================================================
   BASTA PLAY · components.css
   Buttons, cards, mode tiles, game elements, modals, badges
   ============================================================ */

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 13px 24px; border-radius: 14px;
  font-weight: 700; font-size: 15px; letter-spacing: 0.2px;
  position: relative; overflow: hidden; isolation: isolate;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-med) var(--ease), filter var(--t-fast);
  border: 1px solid transparent; user-select: none;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(0.97); }
.btn--primary { background: linear-gradient(135deg, var(--blue), var(--blue-400)); color: #fff; box-shadow: var(--shadow-1), var(--glow-blue); }
.btn--primary:hover { box-shadow: var(--shadow-2), var(--glow-blue); }
.btn--accent { background: linear-gradient(135deg, var(--orange), var(--orange-400)); color: #fff; box-shadow: var(--shadow-1), var(--glow-orange); }
.btn--ghost { background: var(--glass-2); border-color: var(--glass-brd); color: var(--ink); }
.btn--ghost:hover { background: var(--glass); }
.btn--block { width: 100%; }
.btn--lg { padding: 16px 30px; font-size: 16px; }
.btn__sheen { position: absolute; inset: 0; z-index: -1; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); }
.btn:hover .btn__sheen { animation: sheen 0.9s var(--ease); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ---------- Hero (Home) ---------- */
.hero { text-align: center; padding: clamp(18px, 5vw, 40px) 0 clamp(20px, 4vw, 34px); position: relative; }
.hero__badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-brd); font-size: 12.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 18px; }
.hero__badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); animation: pulse 2s infinite; }
.hero__logo { width: clamp(190px, 44vw, 340px); margin: 0 auto 14px; background: #fff; border-radius: var(--r-md); padding: 14px 18px; box-shadow: var(--shadow-2); animation: floatY 6s var(--ease) infinite alternate; }
.hero__title { font-size: clamp(30px, 7vw, 62px); font-weight: 900; line-height: 1.02; letter-spacing: -1px; margin-bottom: 12px; }
.hero__title .grad { background: linear-gradient(120deg, var(--blue), var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero__sub { color: var(--ink-soft); font-size: clamp(14px, 2.4vw, 18px); max-width: 560px; margin: 0 auto 8px; }
.hero__ar { font-family: var(--arabic); direction: rtl; color: var(--orange); font-weight: 700; font-size: clamp(15px, 2.6vw, 20px); margin-top: 4px; }
.hero__cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

/* Stat strip */
.statstrip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 8px auto 30px; max-width: 720px; }
.stat { padding: 14px 8px; border-radius: var(--r-md); text-align: center; background: var(--card); border: 1px solid var(--glass-brd); backdrop-filter: blur(12px); }
.stat__num { font-size: clamp(20px, 4vw, 30px); font-weight: 900; font-variant-numeric: tabular-nums; }
.stat__num.c-b { color: var(--blue-300); } .stat__num.c-o { color: var(--orange); }
.stat__lbl { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.7px; font-weight: 700; margin-top: 2px; }

/* ---------- Section heading ---------- */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 16px; }
.sec-head h2 { font-size: clamp(19px, 3.6vw, 26px); font-weight: 800; letter-spacing: -0.4px; }
.sec-head .pill { font-size: 11px; padding: 5px 12px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--glass-brd); color: var(--ink-soft); font-weight: 700; }

/* ---------- Mode grid ---------- */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.mode {
  position: relative; text-align: start; padding: 22px; border-radius: var(--r-lg);
  background: var(--card); border: 1px solid var(--glass-brd);
  backdrop-filter: blur(16px) saturate(1.3); overflow: hidden; isolation: isolate;
  transition: transform var(--t-med) var(--ease-back), box-shadow var(--t-med) var(--ease), border-color var(--t-med);
  min-height: 190px; display: flex; flex-direction: column;
}
.mode::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(120% 90% at 100% 0%, var(--tint, var(--blue)) 0%, transparent 60%); transition: opacity var(--t-med); }
.mode:hover { transform: translateY(-8px) scale(1.015); box-shadow: var(--shadow-2); border-color: var(--tint, var(--blue)); }
.mode:hover::before { opacity: 0.22; }
.mode:active { transform: translateY(-2px) scale(0.99); }
.mode__ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 27px; margin-bottom: 14px; background: color-mix(in srgb, var(--tint, var(--blue)) 22%, transparent); box-shadow: inset 0 0 0 1px var(--glass-brd); }
.mode__title { font-size: 19px; font-weight: 800; margin-bottom: 5px; }
.mode__desc { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
.mode__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--ink-mute); }
.mode__go { color: var(--tint, var(--blue)); font-weight: 800; display: inline-flex; align-items: center; gap: 5px; transition: gap var(--t-fast); }
.mode:hover .mode__go { gap: 10px; }
.mode__tag { padding: 3px 9px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--glass-brd); }
.mode--daily { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 20px; min-height: auto; background: linear-gradient(120deg, color-mix(in srgb, var(--blue) 20%, var(--card)), color-mix(in srgb, var(--orange) 16%, var(--card))); }
.mode--daily .mode__ico { margin-bottom: 0; flex-shrink: 0; }
.mode--daily .mode__body { flex: 1; }
.mode--daily .mode__cta { flex-shrink: 0; }
@media (max-width: 560px){ .mode--daily { flex-direction: column; align-items: flex-start; } .mode--daily .mode__cta { width: 100%; } }

/* ---------- Game shell ---------- */
.gscreen { animation: viewIn var(--t-med) var(--ease); }
.gtop { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.gtop__title { font-size: clamp(18px, 3.4vw, 26px); font-weight: 800; }
.gtop__spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-brd); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.chip--timer { color: var(--orange); }
.chip--score { color: var(--blue-300); }
.chip.warn { animation: shake 0.4s var(--ease); color: #ff5d5d; }

.progressbar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 20px; }
.progressbar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--orange)); border-radius: 999px; transition: width var(--t-med) var(--ease); }

.gstage { min-height: 320px; }

/* Question card */
.qcard { background: var(--card); border: 1px solid var(--glass-brd); border-radius: var(--r-lg); padding: clamp(18px, 3.5vw, 30px); backdrop-filter: blur(16px); box-shadow: var(--shadow-1); }
.qcard__q { font-size: clamp(17px, 3vw, 23px); font-weight: 800; line-height: 1.35; margin-bottom: 6px; }
.qcard__hint { color: var(--ink-soft); font-size: 14px; margin-bottom: 18px; }

/* Options */
.opts { display: grid; gap: 12px; }
.opt {
  text-align: start; padding: 16px 18px; border-radius: var(--r-md);
  background: var(--glass-2); border: 1.5px solid var(--glass-brd);
  font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 12px;
  transition: transform var(--t-fast) var(--ease), border-color var(--t-fast), background var(--t-fast);
}
.opt:hover:not(:disabled) { transform: translateX(4px); border-color: var(--blue); background: var(--glass); }
.opt:active:not(:disabled) { transform: scale(0.98); }
.opt__key { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--glass); border: 1px solid var(--glass-brd); flex-shrink: 0; }
.opt.correct { border-color: #2ec77a; background: color-mix(in srgb, #2ec77a 20%, transparent); }
.opt.correct .opt__key { background: #2ec77a; color: #fff; }
.opt.wrong { border-color: #ff5d5d; background: color-mix(in srgb, #ff5d5d 18%, transparent); animation: shake 0.4s; }
.opt.wrong .opt__key { background: #ff5d5d; color: #fff; }
.opt:disabled { cursor: default; }

/* Sequence / puzzle chips */
.seq { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.seq__slot-lbl { font-size: 12px; color: var(--ink-mute); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; margin: 14px 0 8px; }
.token {
  padding: 12px 16px; border-radius: 14px; font-weight: 700; font-size: 14px;
  background: var(--glass-2); border: 1.5px solid var(--glass-brd);
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform var(--t-fast) var(--ease-back), border-color var(--t-fast), opacity var(--t-fast);
}
.token:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--blue); }
.token:active:not(:disabled) { transform: scale(0.95); }
.token .num { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; background: var(--blue); color: #fff; }
.token.placed { opacity: 0.35; pointer-events: none; }
.token.answer { border-style: dashed; }
.slots { min-height: 60px; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; border-radius: var(--r-md); border: 1.5px dashed var(--glass-brd); background: var(--glass-2); }
.slots:empty::after { content: "اضغط العناصر بالأسفل بالترتيب الصحيح…"; color: var(--ink-mute); font-size: 13px; font-weight: 600; }

/* Memory tiles */
.mgrid { display: grid; gap: clamp(8px, 2vw, 14px); margin: 0 auto; max-width: 440px; }
.mtile {
  aspect-ratio: 1; border-radius: var(--r-md); position: relative;
  background: var(--glass-2); border: 2px solid var(--glass-brd);
  display: grid; place-items: center; font-size: clamp(22px, 6vw, 34px);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast), background var(--t-fast);
  color: #fff;
}
.mtile:hover { transform: translateY(-3px); }
.mtile:active { transform: scale(0.94); }
.mtile.lit { transform: scale(1.06); box-shadow: 0 0 0 4px rgba(255,255,255,.25), var(--glow); background: var(--fill); }
.mtile.ok { animation: pop 0.4s var(--ease-back); }
.mtile.err { animation: shake 0.4s; box-shadow: 0 0 0 4px rgba(255,93,93,.5); }
.mtile[disabled] { cursor: default; }

/* Speed grid */
.speedwrap { text-align: center; }
.speed-target { font-size: clamp(16px, 3vw, 22px); font-weight: 800; margin-bottom: 6px; }
.speed-target b { padding: 2px 10px; border-radius: 8px; color: #fff; }
.sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 420px; margin: 18px auto 0; }
.scell {
  aspect-ratio: 1; border-radius: var(--r-md); border: 2px solid var(--glass-brd);
  display: grid; place-items: center; font-size: 30px; color: #fff; font-weight: 800;
  transition: transform 0.1s var(--ease), box-shadow 0.1s;
}
.scell:active { transform: scale(0.9); }
.scell.hit { animation: pop 0.35s var(--ease-back); }
.scell.miss { animation: shake 0.35s; }

/* Result card */
.result { text-align: center; padding: clamp(20px, 4vw, 36px); }
.result__ico { font-size: 64px; margin-bottom: 8px; animation: pop 0.6s var(--ease-back); }
.result__title { font-size: clamp(24px, 5vw, 38px); font-weight: 900; margin-bottom: 4px; }
.result__title.win { background: linear-gradient(120deg, var(--blue), var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result__sub { color: var(--ink-soft); margin-bottom: 20px; }
.result__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 460px; margin: 0 auto 24px; }
.reward { padding: 16px 10px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--glass-brd); }
.reward__v { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.reward__l { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-mute); font-weight: 700; }
.reward__v.xp { color: var(--blue-300); } .reward__v.coin { color: var(--orange); }
.result__cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ---------- Badges / Achievements ---------- */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.badge {
  text-align: center; padding: 20px 12px; border-radius: var(--r-lg);
  background: var(--card); border: 1px solid var(--glass-brd); position: relative; overflow: hidden;
  transition: transform var(--t-med) var(--ease-back);
}
.badge.locked { opacity: 0.55; filter: grayscale(0.7); }
.badge.unlocked:hover { transform: translateY(-6px) scale(1.03); box-shadow: var(--shadow-2); }
.badge.unlocked::after { content: ""; position: absolute; top: -40%; left: -40%; width: 180%; height: 60%; background: linear-gradient(transparent, rgba(255,255,255,.25), transparent); transform: rotate(25deg); animation: shimmer 4s linear infinite; }
.badge__ico { font-size: 40px; margin-bottom: 8px; }
.badge__name { font-weight: 800; font-size: 14px; }
.badge__desc { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
.badge__lock { position: absolute; top: 10px; right: 10px; font-size: 12px; opacity: 0.7; }

/* ---------- Leaderboard ---------- */
.lb { display: flex; flex-direction: column; gap: 8px; }
.lb__row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--glass-brd); transition: transform var(--t-fast); }
.lb__row:hover { transform: translateX(4px); }
.lb__row.me { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 12%, var(--card)); }
.lb__rank { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; background: var(--glass-2); flex-shrink: 0; }
.lb__row:nth-child(1) .lb__rank { background: linear-gradient(135deg,#ffd76a,#f5a623); color:#3a2a00; }
.lb__row:nth-child(2) .lb__rank { background: linear-gradient(135deg,#e6ecf7,#aab6cc); color:#2a3348; }
.lb__row:nth-child(3) .lb__rank { background: linear-gradient(135deg,#f0a978,#c9743f); color:#3a1e00; }
.lb__name { font-weight: 700; flex: 1; }
.lb__score { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--blue-300); }
.lb__lvl { font-size: 11px; color: var(--ink-mute); font-weight: 700; }

/* ---------- Toasts ---------- */
.toasts { position: fixed; z-index: 70; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(420px, 92vw); pointer-events: none; }
.toast {
  pointer-events: auto; width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--glass-brd);
  backdrop-filter: blur(18px); box-shadow: var(--shadow-2); animation: toastIn 0.4s var(--ease-back);
}
.toast.out { animation: toastOut 0.3s var(--ease) forwards; }
.toast__ico { font-size: 24px; flex-shrink: 0; }
.toast__t { font-weight: 800; font-size: 14px; }
.toast__d { font-size: 12.5px; color: var(--ink-soft); }
.toast--xp { border-color: var(--blue); } .toast--badge { border-color: var(--orange); }

/* ---------- Modal ---------- */
.modal-root { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; }
.modal-scrim { position: absolute; inset: 0; background: var(--shade); backdrop-filter: blur(4px); animation: fadeIn var(--t-med); }
.modal { position: relative; width: min(560px, 96vw); max-height: 88vh; overflow: auto; border-radius: var(--r-xl); padding: clamp(22px, 4vw, 36px); box-shadow: var(--shadow-2); animation: modalIn 0.4s var(--ease-back); }
.modal__x { position: absolute; top: 14px; right: 14px; }
.modal h3 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.modal p { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 12px; }
.modal ol, .modal ul.rules { padding-left: 18px; color: var(--ink-soft); font-size: 14px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.modal ul.rules { list-style: none; padding-left: 0; }
.modal ul.rules li { display: flex; gap: 10px; align-items: flex-start; }
.modal ul.rules li::before { content: "▹"; color: var(--orange); font-weight: 900; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.field input { padding: 13px 15px; border-radius: 12px; background: var(--glass-2); border: 1.5px solid var(--glass-brd); color: var(--ink); font-size: 15px; font-family: inherit; }

.empty__ico { font-size: 48px; margin-bottom: 10px; opacity: 0.6; }

/* ---------- Loading screen ---------- */
.loader {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: radial-gradient(120% 120% at 50% 0%, #0c1830 0%, #060a16 70%);

.loader.done { opacity: 0; visibility: hidden; }
.loader__aurora { position: absolute; inset: 0; overflow: hidden; }
.loader__aurora::before, .loader__aurora::after {
  content: ""; position: absolute; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(90px);
}
.loader__aurora::before { background: var(--blue); top: -20%; left: -10%; opacity: .5; animation: float1 8s var(--ease) infinite alternate; }
.loader__aurora::after { background: var(--orange); bottom: -25%; right: -10%; opacity: .38; animation: float2 10s var(--ease) infinite alternate; }
.loader__inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.loader__logo-wrap { position: relative; width: 130px; height: 130px; display: grid; place-items: center; }

.loader__title { font-size: 30px; font-weight: 900; letter-spacing: 1px; color: #fff; }

.loader__pct { font-size: 12px; color: #6d7fa6; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Keyframes ---------- */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .55; } }
@keyframes floatY { from { transform: translateY(0); } to { transform: translateY(-12px); } }
@keyframes float1 { from { transform: translate(0,0) scale(1); } to { transform: translate(6vw, 5vh) scale(1.15); } }
@keyframes float2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-5vw, -4vh) scale(1.2); } }
@keyframes float3 { from { transform: translate(0,0); } to { transform: translate(-7vw, 6vh); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes sheen { to { transform: translateX(120%); } }
@keyframes shimmer { from { transform: translateX(-60%) rotate(25deg); } to { transform: translateX(60%) rotate(25deg); } }

@keyframes viewIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes viewOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
.view-out { animation: viewOut var(--t-fast) var(--ease) forwards; }

@keyframes toastIn { from { opacity: 0; transform: translateY(26px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(20px) scale(0.94); } }
@keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* Staggered entrance for grids */
.stagger > * { opacity: 0; animation: viewIn 0.5s var(--ease) forwards; }
.stagger > *:nth-child(1){ animation-delay: .04s; }
.stagger > *:nth-child(2){ animation-delay: .10s; }
.stagger > *:nth-child(3){ animation-delay: .16s; }
.stagger > *:nth-child(4){ animation-delay: .22s; }

.stagger > *:nth-child(7){ animation-delay: .40s; }
.stagger > *:nth-child(8){ animation-delay: .46s; }

/* Count-up flash */
.flash-up { animation: flashUp 0.5s var(--ease); }
@keyframes flashUp { 0% { transform: scale(1); } 40% { transform: scale(1.3); color: var(--orange); } 100% { transform: scale(1); } }

/* Ripple for pressable elements */
.ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); transform: scale(0); animation: ripple 0.6s var(--ease); pointer-events: none; }
@keyframes ripple { to { transform: scale(3.2); opacity: 0; } }

/* ============================================================
   BASTA PLAY · storage.js
   LocalStorage persistence + XP/level/coins progression.
   Exposes window.Store
   ============================================================ */
(function () {
  "use strict";
  const KEY = "basta_play_v1";

  const DEFAULT = {
    name: "مسوّق",
    xp: 0,
    coins: 0,
    wins: 0,
    streak: 0,
    lastPlayed: null,     // YYYY-MM-DD
    dailyDate: null,      // last completed daily
    theme: "dark",
    sound: true,
    music: false,
    achievements: {},     // id -> true
    playedModes: {},      // id -> true
    bests: { puzzle: 0, memory: 0, speed: 0, strategy: 0 },
    leaderboard: []       // [{name, score, level, mode, ts}]
  };

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { ...DEFAULT };
      const parsed = JSON.parse(raw);
      return {
        ...DEFAULT, ...parsed,
        bests: { ...DEFAULT.bests, ...(parsed.bests || {}) },
        achievements: { ...(parsed.achievements || {}) },
        playedModes: { ...(parsed.playedModes || {}) },
        leaderboard: Array.isArray(parsed.leaderboard) ? parsed.leaderboard : []
      };
    } catch (e) {
      return { ...DEFAULT };
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function reset() {
    const keepName = state.name;
    const theme = state.theme, sound = state.sound, music = state.music;
    state = { ...DEFAULT, name: keepName, theme, sound, music };
    save();
  }

  /* ---------- Progression ---------- */
  // XP needed to advance FROM `level` to the next.
  function need(level) { return 100 + (level - 1) * 60; }

  function levelInfo(totalXp) {
    let level = 1, remain = totalXp;
    while (remain >= need(level)) { remain -= need(level); level++; }
    const n = need(level);
    return { level, into: remain, need: n, pct: Math.min(100, Math.round((remain / n) * 100)) };
  }

  function get() { return state; }
  function patch(obj) { Object.assign(state, obj); save(); }

  function addXp(amount) {
    const before = levelInfo(state.xp).level;
    state.xp += Math.max(0, Math.round(amount));
    const after = levelInfo(state.xp).level;
    save();
    return { leveledUp: after > before, from: before, to: after };
  }
  function addCoins(n) { state.coins = Math.max(0, state.coins + Math.round(n)); save(); }

  function unlock(id) {
    if (state.achievements[id]) return false;
    state.achievements[id] = true; save(); return true;
  }
  function has(id) { return !!state.achievements[id]; }

  function markMode(id) {
    if (!state.playedModes[id]) { state.playedModes[id] = true; save(); }
  }
  function modesPlayedCount() { return ["puzzle", "memory", "speed", "strategy"].filter(m => state.playedModes[m]).length; }

  function setBest(mode, value) {
    if (value > (state.bests[mode] || 0)) { state.bests[mode] = value; save(); return true; }
    return false;
  }

  /* ---------- Daily streak ---------- */
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function touchStreak() {
    const t = todayStr();
    if (state.lastPlayed === t) return state.streak;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yest = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
    state.streak = (state.lastPlayed === yest) ? state.streak + 1 : 1;
    state.lastPlayed = t; save();
    return state.streak;
  }

  /* ---------- Leaderboard (local) ---------- */
  function seedLeaderboardIfEmpty() {
    if (state.leaderboard.length) return;
    // Seed with agency-flavoured local rivals so the board never looks empty.
    state.leaderboard = [
      { name: "شبح الاستوديو", score: 940, level: 9, mode: "strategy", ts: 0, bot: true },
      { name: "رحّالة البكسل", score: 820, level: 8, mode: "speed",    ts: 0, bot: true },
      { name: "ناسخ الأفكار",  score: 705, level: 7, mode: "puzzle",   ts: 0, bot: true },
      { name: "بومة النموّ",   score: 610, level: 6, mode: "memory",   ts: 0, bot: true },
      { name: "ثعلب العلامة",  score: 480, level: 5, mode: "strategy", ts: 0, bot: true },
      { name: "حوت النيون",    score: 350, level: 4, mode: "speed",    ts: 0, bot: true }
    ];
    save();
  }
  function addScore(score, mode) {
    const lvl = levelInfo(state.xp).level;
    state.leaderboard.push({ name: state.name || "أنت", score, level: lvl, mode, ts: Date.now(), me: true });
    // keep only best "me" entries + bots; cap 30
    state.leaderboard.sort((a, b) => b.score - a.score);
    state.leaderboard = state.leaderboard.slice(0, 30);
    save();
  }

  window.Store = {
    get, patch, save, reset, load,
    levelInfo, addXp, addCoins, unlock, has,
    markMode, modesPlayedCount, setBest,
    touchStreak, todayStr,
    seedLeaderboardIfEmpty, addScore
  };
})();

/* ============================================================
   BASTA PLAY · audio.js
   Synthesized sound effects + ambient background music via
   the Web Audio API — no external audio files. Exposes window.Sound
   ============================================================ */
(function () {
  "use strict";
  let ctx = null;
  let master = null;
  let musicGain = null;
  let musicOn = false;
  let musicTimer = null;
  let sfxOn = true;

  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
    musicGain = ctx.createGain();
    musicGain.gain.value = 0.0;
    musicGain.connect(master);
  }

  function resume() { if (ctx && ctx.state === "suspended") ctx.resume(); }

  // Single tone
  function tone(freq, dur, type, when, vol, glideTo) {
    if (!ctx) return;
    const t0 = ctx.currentTime + (when || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  const FX = {
    click:   () => tone(520, 0.07, "triangle", 0, 0.16),
    tap:     () => tone(660, 0.06, "sine", 0, 0.14),
    correct: () => { tone(660, 0.12, "sine", 0, 0.2); tone(880, 0.16, "sine", 0.09, 0.2); },
    wrong:   () => { tone(200, 0.22, "sawtooth", 0, 0.18, 120); },
    coin:    () => { tone(988, 0.08, "square", 0, 0.14); tone(1319, 0.12, "square", 0.06, 0.14); },
    level:   () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, "triangle", i * 0.09, 0.2)); },
    win:     () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, "sine", i * 0.1, 0.22)); },
    lose:    () => { [392, 330, 262].forEach((f, i) => tone(f, 0.24, "sawtooth", i * 0.12, 0.16)); },
    tick:    () => tone(1200, 0.04, "sine", 0, 0.08),
    reveal:  () => tone(440, 0.1, "sine", 0, 0.12, 720),
    badge:   () => { [659, 988, 1319].forEach((f, i) => tone(f, 0.2, "triangle", i * 0.08, 0.2)); }
  };

  function fx(name) {
    if (!sfxOn) return;
    ensure(); resume();
    if (FX[name]) FX[name]();
  }

  /* ---------- Ambient music ----------
     A gentle, evolving arpeggio in the brand's mood (blue/orange = calm/warm). */
  const SCALE = [261.63, 329.63, 392.0, 523.25, 659.25, 784.0];
  let step = 0;
  function loopMusic() {
    if (!musicOn || !ctx) return;
    const now = ctx.currentTime;
    // bass pad
    const padOsc = ctx.createOscillator();
    const padG = ctx.createGain();
    padOsc.type = "sine";
    padOsc.frequency.value = 130.81;
    padG.gain.setValueAtTime(0.0001, now);
    padG.gain.linearRampToValueAtTime(0.05, now + 0.6);
    padG.gain.linearRampToValueAtTime(0.0001, now + 1.8);
    padOsc.connect(padG); padG.connect(musicGain);
    padOsc.start(now); padOsc.stop(now + 2);

    // arpeggio note
    const f = SCALE[step % SCALE.length];
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.09, now + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
    o.connect(g); g.connect(musicGain);
    o.start(now); o.stop(now + 1);
    step++;
    musicTimer = setTimeout(loopMusic, 460);
  }

  function setMusic(on) {
    ensure(); resume();
    musicOn = on;
    if (!musicGain) return musicOn;
    if (on) {
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.8);
      clearTimeout(musicTimer);
      loopMusic();
    } else {
      musicGain.gain.linearRampToValueAtTime(0.0, ctx.currentTime + 0.4);
      clearTimeout(musicTimer);
    }
    return musicOn;
  }
  function toggleMusic() { return setMusic(!musicOn); }
  function setSfx(on) { sfxOn = on; }
  function isMusicOn() { return musicOn; }

  // Unlock audio on first user gesture (autoplay policies)
  function primeOnGesture() {
    const kick = () => { ensure(); resume(); window.removeEventListener("pointerdown", kick); window.removeEventListener("keydown", kick); };
    window.addEventListener("pointerdown", kick, { once: false });
    window.addEventListener("keydown", kick, { once: false });
  }

  window.Sound = { fx, setMusic, toggleMusic, isMusicOn, setSfx, primeOnGesture };
})();

/* ============================================================
   BASTA PLAY · ui.js
   Theme, HUD, toasts, confetti, modal, ripple, transitions.
   Exposes window.UI
   ============================================================ */
(function () {
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  /* ---------- Theme ---------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#eef2fb" : "#1E5BD6");
  }

  /* ---------- HUD ---------- */
  function renderHUD() {
    const s = Store.get();
    const info = Store.levelInfo(s.xp);
    setText("#hud-level", info.level);
    setText("#hud-xp", info.into + "/" + info.need);
    const fill = $("#hud-xpfill"); if (fill) fill.style.width = info.pct + "%";
    animateNumber("#hud-coins", s.coins);
    // drawer profile
    setText("#drawer-name", s.name || "Marketer");
    setText("#drawer-rank", rankName(info.level));
    const ava = $("#drawer-avatar"); if (ava) ava.textContent = (s.name || "B").trim().charAt(0).toUpperCase();
  }

  function rankName(level) {
    const R = BASTA_DATA.RANKS;
    let name = R[0].name;
    for (const r of R) if (level >= r.min) name = r.name;
    return name;
  }

  function setText(sel, v) { const el = $(sel); if (el) el.textContent = v; }

  function animateNumber(sel, to) {
    const el = $(sel); if (!el) return;
    const from = parseInt(el.textContent.replace(/\D/g, "")) || 0;
    if (from === to) { el.textContent = to; return; }
    const dur = 500, start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (p < 1) requestAnimationFrame(tick); else { el.textContent = to; el.classList.add("flash-up"); setTimeout(() => el.classList.remove("flash-up"), 500); }
    }
    requestAnimationFrame(tick);
  }

  /* ---------- Toasts ---------- */
  function toast(opts) {
    const { title = "", desc = "", icon = "✨", kind = "" } = opts || {};
    const root = $("#toasts"); if (!root) return;
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " toast--" + kind : "");
    el.innerHTML = `<div class="toast__ico">${icon}</div><div><div class="toast__t">${esc(title)}</div>${desc ? `<div class="toast__d">${esc(desc)}</div>` : ""}</div>`;
    root.appendChild(el);
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, opts.ms || 2600);
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  /* ---------- Confetti ---------- */
  const canvas = $("#confetti");
  const cx = canvas ? canvas.getContext("2d") : null;
  let parts = [], raf = null;
  const COLORS = ["#1E5BD6", "#F97316", "#ffffff", "#4d82e6", "#fb8f42"];

  function sizeCanvas() {
    if (!canvas) return;
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
  }
  window.addEventListener("resize", sizeCanvas);
  sizeCanvas();

  function confetti(count) {
    if (!cx) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const n = count || 130;
    for (let i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * canvas.width,
        y: -20 * devicePixelRatio,
        vx: (Math.random() - 0.5) * 6 * devicePixelRatio,
        vy: (Math.random() * 3 + 2) * devicePixelRatio,
        g: 0.12 * devicePixelRatio,
        size: (Math.random() * 7 + 4) * devicePixelRatio,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1
      });
    }
    if (!raf) raf = requestAnimationFrame(step);
  }

  function step() {
    cx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.life -= 0.004;
      cx.save();
      cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.globalAlpha = Math.max(0, p.life);
      cx.fillStyle = p.color;
      cx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      cx.restore();
    }
    parts = parts.filter(p => p.life > 0 && p.y < canvas.height + 40);
    if (parts.length) raf = requestAnimationFrame(step);
    else { cx.clearRect(0, 0, canvas.width, canvas.height); raf = null; }
  }

  /* ---------- Modal ---------- */
  let lastFocus = null;
  function modal(html) {
    const root = $("#modal-root"); const body = $("#modal-body");
    if (!root || !body) return;
    lastFocus = document.activeElement;
    body.innerHTML = html;
    root.hidden = false;
    document.body.style.overflow = "hidden";
    const focusable = body.querySelector("button, input, a, [tabindex]");
    if (focusable) setTimeout(() => focusable.focus(), 60);
  }
  function closeModal() {
    const root = $("#modal-root");
    if (!root) return;
    root.hidden = true;
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { const r = $("#modal-root"); if (r && !r.hidden) closeModal(); }
  });

  /* ---------- Ripple ---------- */
  function attachRipples() {
    document.addEventListener("pointerdown", (e) => {
      const t = e.target.closest(".btn, .mode, .opt, .token, .mtile, .scell, .icon-btn, .drawer__link, .backbtn");
      if (!t) return;
      if (getComputedStyle(t).position === "static") t.style.position = "relative";
      const rect = t.getBoundingClientRect();
      const r = document.createElement("span");
      r.className = "ripple";
      const size = Math.max(rect.width, rect.height);
      r.style.width = r.style.height = size + "px";
      r.style.left = (e.clientX - rect.left - size / 2) + "px";
      r.style.top = (e.clientY - rect.top - size / 2) + "px";
      t.appendChild(r);
      setTimeout(() => r.remove(), 620);
    });
  }

  /* ---------- Reward flow: apply XP/coins, level-up + achievements ---------- */
  function grant(xp, coins) {
    if (coins) { Store.addCoins(coins); Sound.fx("coin"); }
    let lv = null;
    if (xp) { lv = Store.addXp(xp); }
    renderHUD();
    if (lv && lv.leveledUp) {
      Sound.fx("level");
      confetti(90);
      toast({ icon: "⭐", title: "ترقية مستوى!", desc: "وصلت إلى المستوى " + lv.to + " · " + rankName(lv.to), kind: "xp", ms: 3200 });
    }
    return lv;
  }

  function celebrateBadge(id) {
    const a = BASTA_DATA.ACHIEVEMENTS.find(x => x.id === id);
    if (!a) return;
    Sound.fx("badge");
    confetti(120);
    toast({ icon: a.icon, title: "وسام جديد!", desc: a.name + " — " + a.desc, kind: "badge", ms: 3600 });
  }

  window.UI = {
    applyTheme, renderHUD, rankName, toast, confetti, modal, closeModal,
    attachRipples, grant, celebrateBadge, animateNumber, esc, $, $$
  };
})();

/* ============================================================
   BASTA PLAY · games/puzzle.js — Marketing Puzzle
   Order sequences & pick best answers. window.Games.puzzle
   ============================================================ */
(function () {
  "use strict";
  window.Games = window.Games || {};
  const { $, esc } = window.UI;

  function shuffle(arr, rnd) {
    const a = arr.slice(); rnd = rnd || Math.random;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  window.Games.puzzle = {
    label: "لغز التسويق",
    start(mount, done, opts) {
      opts = opts || {};
      const rnd = opts.rnd || Math.random;
      const pool = shuffle(BASTA_DATA.PUZZLES, rnd);
      const rounds = pool.slice(0, opts.count || 5);
      let idx = 0, correct = 0;

      function render() {
        const p = rounds[idx];
        const pct = Math.round((idx / rounds.length) * 100);
        mount.innerHTML = `
          <div class="gscreen">
            <div class="gtop">
              <span class="chip">لغز ${idx + 1}/${rounds.length}</span>
              <div class="gtop__spacer"></div>
              <span class="chip chip--score">✓ ${correct}</span>
            </div>
            <div class="progressbar"><span style="width:${pct}%"></span></div>
            <div class="qcard" id="qc"></div>
          </div>`;
        if (p.type === "order") renderOrder(p); else renderQuiz(p);
      }

      function renderQuiz(p) {
        const qc = $("#qc");
        qc.innerHTML = `
          <div class="qcard__q">${esc(p.q)}</div>
          <div class="qcard__hint">💡 ${esc(p.hint)}</div>
          <div class="opts" id="opts"></div>`;
        // (اختيار من متعدّد)
        const box = $("#opts");
        p.options.forEach((o, i) => {
          const b = document.createElement("button");
          b.className = "opt"; b.type = "button";
          b.innerHTML = `<span class="opt__key">${String.fromCharCode(65 + i)}</span><span>${esc(o)}</span>`;
          b.addEventListener("click", () => choose(i, p, box));
          box.appendChild(b);
        });
      }

      function choose(i, p, box) {
        const btns = box.querySelectorAll(".opt");
        btns.forEach(b => b.disabled = true);
        if (i === p.answer) {
          btns[i].classList.add("correct"); correct++; Sound.fx("correct");
        } else {
          btns[i].classList.add("wrong"); btns[p.answer].classList.add("correct"); Sound.fx("wrong");
        }
        setTimeout(next, 850);
      }

      function renderOrder(p) {
        const qc = $("#qc");
        const shuffled = shuffle(p.items, rnd);
        // avoid an already-correct shuffle
        if (shuffled.join() === p.items.join() && p.items.length > 1) shuffled.reverse();
        const placed = [];
        qc.innerHTML = `
          <div class="qcard__q">${esc(p.q)}</div>
          <div class="qcard__hint">💡 ${esc(p.hint)} — اضغط العناصر بالترتيب.</div>
          <div class="seq__slot-lbl">ترتيبك</div>
          <div class="slots" id="slots" aria-live="polite"></div>
          <div class="seq__slot-lbl">الخيارات</div>
          <div class="seq" id="bank"></div>`;
        const bank = $("#bank"), slots = $("#slots");

        shuffled.forEach((label, i) => {
          const t = document.createElement("button");
          t.className = "token answer"; t.type = "button"; t.dataset.label = label;
          t.innerHTML = `<span>${esc(label)}</span>`;
          t.addEventListener("click", () => {
            if (t.classList.contains("placed")) return;
            t.classList.add("placed"); Sound.fx("tap");
            placed.push(label);
            const chip = document.createElement("button");
            chip.className = "token"; chip.type = "button";
            chip.innerHTML = `<span class="num">${placed.length}</span><span>${esc(label)}</span>`;
            chip.addEventListener("click", () => { // undo
              const li = placed.indexOf(label);
              if (li > -1) placed.splice(li, 1);
              chip.remove(); t.classList.remove("placed");
              renumber();
            });
            slots.appendChild(chip);
            if (placed.length === p.items.length) check(p, slots, bank);
          });
          bank.appendChild(t);
        });

        function renumber() { slots.querySelectorAll(".num").forEach((n, i) => n.textContent = i + 1); }
      }

      function check(p, slots, bank) {
        const placed = Array.from(slots.querySelectorAll(".token")).map(c => c.querySelector("span:last-child").textContent);
        const ok = placed.join() === p.items.join();
        slots.querySelectorAll(".token").forEach((c, i) => {
          c.classList.add(placed[i] === p.items[i] ? "correct" : "wrong");
          c.disabled = true;
        });
        bank.querySelectorAll(".token").forEach(t => t.disabled = true);
        if (ok) { correct++; Sound.fx("win"); } else Sound.fx("wrong");
        setTimeout(next, 1100);
      }

      function next() {
        idx++;
        if (idx >= rounds.length) return finish();
        render();
      }

      function finish() {
        const perfect = correct === rounds.length;
        const score = correct * 100 + (perfect ? 50 : 0);
        done({
          mode: "puzzle", won: correct >= Math.ceil(rounds.length / 2),
          perfect, score, correct, total: rounds.length,
          xp: correct * 22 + (perfect ? 40 : 0),
          coins: correct * 6 + (perfect ? 20 : 0),
          detail: `حللت ${correct} من ${rounds.length} ألغاز`
        });
      }

      render();
    }
  };
})();

/* ============================================================
   BASTA PLAY · games/memory.js — Memory Challenge
   Watch a brand-tile sequence, reproduce it. window.Games.memory
   ============================================================ */
(function () {
  "use strict";
  window.Games = window.Games || {};
  const { $ } = window.UI;

  window.Games.memory = {
    label: "تحدّي الذاكرة",
    start(mount, done, opts) {
      opts = opts || {};
      const rnd = opts.rnd || Math.random;
      const TILES = BASTA_DATA.MEMORY_TILES;
      let seq = [];
      let input = [];
      let round = 1;
      let accepting = false;
      let alive = true;
      const startLen = opts.startLen || 3;

      function shell() {
        mount.innerHTML = `
          <div class="gscreen speedwrap">
            <div class="gtop">
              <span class="chip chip--score">الجولة ${round}</span>
              <div class="gtop__spacer"></div>
              <span class="chip">الطول ${seq.length || startLen}</span>
            </div>
            <p class="qcard__hint" id="mstatus" style="text-align:center;margin-bottom:14px">راقب جيداً…</p>
            <div class="mgrid" id="mgrid"></div>
          </div>`;
        const grid = $("#mgrid");
        grid.style.gridTemplateColumns = "repeat(3, 1fr)";
        TILES.forEach((t, i) => {
          const b = document.createElement("button");
          b.className = "mtile"; b.type = "button"; b.dataset.i = i;
          b.style.setProperty("--fill", t.fill);
          b.style.setProperty("--glow", t.glow);
          b.setAttribute("aria-label", t.label);
          b.innerHTML = `<span>${t.icon}</span>`;
          b.addEventListener("click", () => tap(i, b));
          grid.appendChild(b);
        });
      }

      function status(msg) { const s = $("#mstatus"); if (s) s.textContent = msg; }

      function nextRound() {
        input = [];
        seq.push(Math.floor(rnd() * TILES.length));
        shell();
        status("راقب جيداً…");
        playback();
      }

      function playback() {
        accepting = false;
        let i = 0;
        const gap = Math.max(360, 620 - seq.length * 20);
        const iv = setInterval(() => {
          if (!alive) { clearInterval(iv); return; }
          if (i > 0) unlight(seq[i - 1]);
          if (i >= seq.length) {
            clearInterval(iv);
            setTimeout(() => { if (alive) { accepting = true; status("دورك — أعِد التسلسل"); } }, 260);
            return;
          }
          light(seq[i]); Sound.fx("reveal");
          i++;
        }, gap);
      }

      function light(i) { const el = mount.querySelector(`.mtile[data-i="${i}"]`); if (el) el.classList.add("lit"); }
      function unlight(i) { const el = mount.querySelector(`.mtile[data-i="${i}"]`); if (el) el.classList.remove("lit"); }

      function tap(i, el) {
        if (!accepting || !alive) return;
        el.classList.add("lit"); Sound.fx("tap");
        setTimeout(() => el.classList.remove("lit"), 180);
        input.push(i);
        const pos = input.length - 1;
        if (input[pos] !== seq[pos]) return fail(el);
        el.classList.add("ok"); setTimeout(() => el.classList.remove("ok"), 380);
        if (input.length === seq.length) {
          accepting = false;
          Sound.fx("correct");
          round++;
          status("ممتاز! الجولة التالية…");
          setTimeout(() => { if (alive) nextRound(); }, 820);
        }
      }

      function fail(el) {
        accepting = false; alive = false;
        el.classList.add("err"); Sound.fx("lose");
        status("انكسر التسلسل!");
        // reveal correct next tile briefly
        setTimeout(finish, 900);
      }

      function finish() {
        const reached = seq.length - (alive ? 0 : 1); // last shown length successfully repeated
        const level = Math.max(0, reached);
        const won = level >= startLen + 1;
        done({
          mode: "memory", won,
          score: level * 60,
          level,
          reachedLen: level,
          xp: level * 18,
          coins: level * 5,
          detail: `تذكّرت تسلسلاً من ${level}`
        });
      }

      nextRound();

      // return a stop hook for router cleanup
      return { stop() { alive = false; } };
    }
  };
})();

/* ============================================================
   BASTA PLAY · games/speed.js — Speed Challenge
   React fast: tap the target brand element. window.Games.speed
   ============================================================ */
(function () {
  "use strict";
  window.Games = window.Games || {};
  const { $, esc } = window.UI;

  window.Games.speed = {
    label: "تحدّي السرعة",
    start(mount, done, opts) {
      opts = opts || {};
      const rnd = opts.rnd || Math.random;
      const EL = BASTA_DATA.SPEED_ELEMENTS;
      const DURATION = opts.time || 30;
      let score = 0, misses = 0, best = 0;
      let timeLeft = DURATION;
      let target = null;
      let alive = true;
      let timer = null;

      function shell() {
        mount.innerHTML = `
          <div class="gscreen speedwrap">
            <div class="gtop">
              <span class="chip chip--timer" id="stimer">⏱ ${DURATION}ث</span>
              <div class="gtop__spacer"></div>
              <span class="chip chip--score" id="sscore">النقاط 0</span>
            </div>
            <div class="progressbar"><span id="sbar" style="width:100%"></span></div>
            <div class="speed-target" id="starget"></div>
            <div class="sgrid" id="sgrid"></div>
          </div>`;
      }

      function newTarget() {
        target = EL[Math.floor(rnd() * EL.length)];
        // Build 9 cells, ensure at least one target
        const cells = [];
        const targetPos = Math.floor(rnd() * 9);
        for (let i = 0; i < 9; i++) {
          cells.push(i === targetPos ? target : EL[Math.floor(rnd() * EL.length)]);
        }
        const grid = $("#sgrid"); grid.innerHTML = "";
        cells.forEach((c) => {
          const b = document.createElement("button");
          b.className = "scell"; b.type = "button";
          b.style.background = c.color;
          b.innerHTML = `<span>${c.icon}</span>`;
          b.setAttribute("aria-label", c.name);
          b.addEventListener("click", () => hit(c, b));
          grid.appendChild(b);
        });
        const st = $("#starget");
        st.innerHTML = `اضغط على <b style="background:${target.color}">${esc(target.name)}</b>`;
      }

      function hit(c, b) {
        if (!alive) return;
        if (c.icon === target.icon && c.color === target.color) {
          score++; Sound.fx("correct");
          b.classList.add("hit");
          $("#sscore").textContent = "النقاط " + score;
          newTarget();
        } else {
          misses++; Sound.fx("wrong");
          b.classList.add("miss");
          timeLeft = Math.max(0, timeLeft - 1); // penalty
          const chip = $("#stimer"); chip.classList.add("warn"); setTimeout(() => chip.classList.remove("warn"), 400);
          setTimeout(() => b.classList.remove("miss"), 350);
        }
      }

      function tick() {
        timeLeft--;
        const chip = $("#stimer"); if (chip) chip.textContent = "⏱ " + timeLeft + "ث";
        const bar = $("#sbar"); if (bar) bar.style.width = (timeLeft / DURATION * 100) + "%";
        if (timeLeft <= 5 && timeLeft > 0) Sound.fx("tick");
        if (timeLeft <= 0) return finish();
      }

      function finish() {
        alive = false; clearInterval(timer); Sound.fx(score >= 10 ? "win" : "lose");
        done({
          mode: "speed", won: score >= 10,
          score, misses,
          xp: score * 12,
          coins: score * 4,
          detail: `${score} ضغطة صحيحة · ${misses} خطأ`
        });
      }

      shell(); newTarget();
      timer = setInterval(() => { if (alive) tick(); }, 1000);

      return { stop() { alive = false; clearInterval(timer); } };
    }
  };
})();

/* ============================================================
   BASTA PLAY · games/strategy.js — Strategy Challenge
   Pick the smartest marketing decision. window.Games.strategy
   ============================================================ */
(function () {
  "use strict";
  window.Games = window.Games || {};
  const { $, esc } = window.UI;

  function shuffle(arr, rnd) {
    const a = arr.slice(); rnd = rnd || Math.random;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  window.Games.strategy = {
    label: "تحدّي الاستراتيجية",
    start(mount, done, opts) {
      opts = opts || {};
      const rnd = opts.rnd || Math.random;
      const rounds = shuffle(BASTA_DATA.STRATEGY, rnd).slice(0, opts.count || 5);
      let idx = 0, points = 0, maxPoints = 0, aces = 0;

      function render() {
        const s = rounds[idx];
        const pct = Math.round((idx / rounds.length) * 100);
        mount.innerHTML = `
          <div class="gscreen">
            <div class="gtop">
              <span class="chip">السيناريو ${idx + 1}/${rounds.length}</span>
              <div class="gtop__spacer"></div>
              <span class="chip chip--score">${points} نقطة</span>
            </div>
            <div class="progressbar"><span style="width:${pct}%"></span></div>
            <div class="qcard">
              <div class="qcard__hint" style="margin-bottom:8px">📋 ${esc(s.context)}</div>
              <div class="qcard__q">${esc(s.scenario)}</div>
              <div class="opts" id="opts" style="margin-top:16px"></div>
              <div id="why"></div>
            </div>
          </div>`;
        const box = $("#opts");
        const order = shuffle(s.options.map((o, i) => ({ o, i })), rnd);
        const bestPts = Math.max(...s.options.map(o => o.pts));
        order.forEach(({ o }, i) => {
          const b = document.createElement("button");
          b.className = "opt"; b.type = "button";
          b.innerHTML = `<span class="opt__key">${String.fromCharCode(65 + i)}</span><span>${esc(o.t)}</span>`;
          b.addEventListener("click", () => pick(o, b, box, s, bestPts));
          box.appendChild(b);
        });
      }

      function pick(o, btn, box, s, bestPts) {
        box.querySelectorAll(".opt").forEach(b => b.disabled = true);
        points += o.pts; maxPoints += bestPts;
        if (o.pts === bestPts) { btn.classList.add("correct"); aces++; Sound.fx("correct"); }
        else if (o.pts === 0) { btn.classList.add("wrong"); Sound.fx("wrong"); }
        else { btn.classList.add("correct"); btn.style.borderColor = "var(--orange)"; Sound.fx("tap"); }
        // reveal best if not chosen
        if (o.pts !== bestPts) {
          const bestOpt = s.options.find(x => x.pts === bestPts);
          box.querySelectorAll(".opt").forEach(b => {
            if (b.querySelector("span:last-child").textContent === bestOpt.t) b.classList.add("correct");
          });
        }
        const why = $("#why");
        why.innerHTML = `<div class="qcard" style="margin-top:14px;background:var(--glass-2)">
          <strong style="color:var(--orange)">السبب:</strong> ${esc(o.why)}
          <div style="margin-top:12px"><button class="btn btn--primary" id="nextS">التالي ←</button></div></div>`;
        $("#nextS").addEventListener("click", () => { Sound.fx("click"); next(); });
      }

      function next() {
        idx++;
        if (idx >= rounds.length) return finish();
        render();
      }

      function finish() {
        const ratio = maxPoints ? points / maxPoints : 0;
        const perfect = aces === rounds.length;
        done({
          mode: "strategy", won: ratio >= 0.6, perfect,
          score: Math.round(points * 40),
          points, maxPoints, aces,
          xp: points * 10 + (perfect ? 40 : 0),
          coins: points * 3 + (perfect ? 15 : 0),
          detail: `${points}/${maxPoints} نقطة استراتيجية · ${aces} قرار مثالي`
        });
      }

      render();
    }
  };
})();

/* ============================================================
   BASTA PLAY · games/daily.js — Daily Challenge
   Deterministic pick of a mode + seed per calendar day.
   window.Games.daily
   ============================================================ */
(function () {
  "use strict";
  window.Games = window.Games || {};

  function dateSeed() {
    const t = Store.todayStr(); // YYYY-MM-DD
    let h = 2166136261;
    for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  window.Games.daily = {
    label: "Daily Challenge",
    // Returns {modeId, rnd, played} so the router can show/lock it.
    plan() {
      const seed = dateSeed();
      const rnd = BASTA_DATA.seededRandom(seed);
      const modeIds = ["puzzle", "memory", "speed", "strategy"];
      const modeId = modeIds[Math.floor(rnd() * modeIds.length)];
      const played = Store.get().dailyDate === Store.todayStr();
      return { modeId, seed, played, label: window.Games[modeId].label };
    },
    start(mount, done) {
      const plan = this.plan();
      const rnd = BASTA_DATA.seededRandom(plan.seed);
      // Wrap the chosen game; daily gives a coin bonus on completion.
      window.Games[plan.modeId].start(mount, (res) => {
        res.daily = true;
        res.coins = Math.round(res.coins * 1.5) + 25; // bonus
        res.xp = Math.round(res.xp * 1.5);
        res.detail = "يومي · " + res.detail;
        Store.patch({ dailyDate: Store.todayStr() });
        done(res);
      }, { rnd, count: 5, time: 30, startLen: 3 });
    }
  };
})();

/* ============================================================
   BASTA PLAY · main.js — متحكّم التطبيق والموجّه
   التحميل، التنقّل، الشاشات، منطق المكافآت والأوسمة.
   ============================================================ */
(function () {
  "use strict";
  const { $, $$ } = window.UI;
  let activeGame = null; // يحمل {stop} للتنظيف

  const MODE_AR = { puzzle: "لغز التسويق", memory: "تحدّي الذاكرة", speed: "تحدّي السرعة", strategy: "تحدّي الاستراتيجية", daily: "التحدّي اليومي" };

  /* ---------- شاشة التحميل ---------- */
  function runLoader() {
    const loader = $("#loader"), fill = $(".loader__fill"), pct = $(".loader__pct"), app = $("#app");
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 16 + 6;
      if (p >= 100) { p = 100; clearInterval(iv); setTimeout(boot, 350); }
      if (fill) fill.style.width = p + "%";
      if (pct) pct.textContent = Math.floor(p) + "%";
    }, 180);
    function boot() {
      loader.classList.add("done");
      app.hidden = false;
      setTimeout(() => { loader.remove(); }, 650);
      init();
    }
  }

  /* ---------- الإقلاع والربط ---------- */
  function init() {
    const s = Store.get();
    Store.seedLeaderboardIfEmpty();
    UI.applyTheme(s.theme);
    UI.renderHUD();
    UI.attachRipples();
    Sound.primeOnGesture();
    Sound.setSfx(s.sound);
    bindChrome();
    if (s.music) { $("#btn-music").setAttribute("aria-pressed", "true"); }
    if (!localStorage.getItem("basta_named")) askName(); else nav("home");
    window.addEventListener("keydown", globalKeys);
  }

  function askName() {
    UI.modal(`
      <h3>أهلاً بك في بسطة بلاي 👋</h3>
      <p>تجربة الألعاب التسويقية المميّزة. بأي اسم نناديك في قائمة المتصدّرين؟</p>
      <div class="field"><label for="pname">اسمك</label>
        <input id="pname" maxlength="18" placeholder="مثال: بسطة برو" value="${UI.esc(Store.get().name === 'مسوّق' ? '' : Store.get().name)}"/></div>
      <button class="btn btn--primary btn--block" id="startBtn">لنبدأ اللعب ←</button>`);
    const go = () => {
      const v = ($("#pname").value || "").trim().slice(0, 18) || "مسوّق";
      Store.patch({ name: v });
      localStorage.setItem("basta_named", "1");
      UI.closeModal(); UI.renderHUD(); Sound.fx("win"); UI.confetti(80);
      nav("home");
    };
    $("#startBtn").addEventListener("click", go);
    $("#pname").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }

  function bindChrome() {
    $("#brand-home").addEventListener("click", () => nav("home"));
    $("#btn-menu").addEventListener("click", () => toggleDrawer(true));
    $("#drawer-close").addEventListener("click", () => toggleDrawer(false));
    $("#scrim").addEventListener("click", () => toggleDrawer(false));
    $$(".drawer__link").forEach(b => b.addEventListener("click", () => { toggleDrawer(false); nav(b.dataset.nav); }));
    $("#btn-reset").addEventListener("click", confirmReset);

    $("#btn-theme").addEventListener("click", () => {
      const cur = Store.get().theme === "light" ? "dark" : "light";
      Store.patch({ theme: cur }); UI.applyTheme(cur); Sound.fx("click");
    });
    const bs = $("#btn-sound");
    bs.addEventListener("click", () => {
      const on = !(Store.get().sound);
      Store.patch({ sound: on }); Sound.setSfx(on);
      bs.setAttribute("aria-pressed", String(on)); if (on) Sound.fx("click");
    });
    bs.setAttribute("aria-pressed", String(Store.get().sound));
    const bm = $("#btn-music");
    bm.addEventListener("click", () => {
      const on = Sound.toggleMusic();
      Store.patch({ music: on });
      bm.setAttribute("aria-pressed", String(on)); Sound.fx("click");
    });
  }

  function toggleDrawer(open) {
    const d = $("#drawer"), sc = $("#scrim");
    d.classList.toggle("open", open);
    d.setAttribute("aria-hidden", String(!open));
    sc.hidden = !open;
    if (open) Sound.fx("click");
  }

  function confirmReset() {
    UI.modal(`<h3>تصفير التقدّم؟</h3><p>سيؤدّي هذا إلى مسح خبرتك وعملاتك وأوسمتك ونقاطك في المتصدّرين. يبقى اسمك وإعداداتك كما هي. لا يمكن التراجع عن هذا.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn--accent" id="doReset">نعم، صفّر</button>
        <button class="btn btn--ghost" data-close>إلغاء</button></div>`);
    $("#doReset").addEventListener("click", () => {
      Store.reset(); Store.seedLeaderboardIfEmpty(); UI.renderHUD(); UI.closeModal();
      UI.toast({ icon: "♻️", title: "تم تصفير التقدّم", desc: "بداية جديدة — بالتوفيق!" });
      nav("home");
    });
  }

  function globalKeys(e) {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "Escape") { if ($("#drawer").classList.contains("open")) toggleDrawer(false); }
    // أرقام لاختيار الخيارات في الألعاب
    if (/^[1-9]$/.test(e.key)) {
      const opts = $$(".opts .opt:not(:disabled), .sgrid .scell, .seq .token:not(.placed)");
      const i = parseInt(e.key) - 1;
      if (opts[i]) opts[i].click();

        <p class="hero__sub">تجربة تسويقية تفاعلية — ألغاز وذاكرة وسرعة واستراتيجية، بروح علامة بسطة.</p>
        <p class="hero__ar" dir="rtl">نصنع التجربة ويستمر الأثر</p>
      </section>

      <div class="statstrip stagger">
        <div class="stat"><div class="stat__num c-b">${info.level}</div><div class="stat__lbl">المستوى</div></div>
        <div class="stat"><div class="stat__num">${s.xp}</div><div class="stat__lbl">إجمالي الخبرة</div></div>
        <div class="stat"><div class="stat__num c-o">${s.coins}</div><div class="stat__lbl">العملات</div></div>
        <div class="stat"><div class="stat__num">${s.streak}🔥</div><div class="stat__lbl">سلسلة الأيام</div></div>
      </div>

      <div class="sec-head"><h2>اختر تحدّيك</h2><span class="pill">${Store.modesPlayedCount()}/4 أوضاع جُرّبت</span></div>
      <div class="modes stagger" id="modes"></div>`;

    const wrap = $("#modes");
    const daily = document.createElement("button");

    daily.innerHTML = `
      <div class="mode__ico">📅</div>

        <div class="mode__title">التحدّي اليومي ${dp.played ? "✓" : ""}</div>
        <div class="mode__desc">${dp.played ? "انتهيت اليوم — عُد غداً لتحدٍّ جديد." : "مفاجأة اليوم: <b>" + UI.esc(MODE_AR[dp.modeId]) + "</b>. عملات وخبرة إضافية!"}</div>
